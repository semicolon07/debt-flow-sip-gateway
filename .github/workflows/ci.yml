name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Parse PowerShell deployment scripts
        shell: pwsh
        run: Get-ChildItem scripts/*.ps1 | ForEach-Object { [void][ScriptBlock]::Create((Get-Content -LiteralPath $_.FullName -Raw)) }
      - shell: pwsh
        run: ./scripts/build.ps1 -Version "ci-${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sip-gateway-windows-amd64
          path: dist/

