name: debt-flow-sip-gateway-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=0.0.0.0:9090
    ports:
      - 127.0.0.1:9091:9090
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/sip-gateway.rules.yml:/etc/prometheus/rules/sip-gateway.rules.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    ports:
      - 127.0.0.1:9093:9093
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.4.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/sip-gateway-dashboard.json:/var/lib/grafana/dashboards/sip-gateway-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
