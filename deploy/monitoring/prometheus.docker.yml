global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: debt-flow-sip-gateway
    environment: local

rule_files:
  - /etc/prometheus/rules/sip-gateway.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: debt-flow-sip-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:9090]
        labels:
          node: sip-gateway-01
